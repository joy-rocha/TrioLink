# We have a conf and classes directory, add to BBPATH
# Isso aqui faz com o bitbake identifique essa layer como válida
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
# Isso aqui faz procurar .bb e .bbappend, então posteriormente uso da customização do kernel
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Esse aqui é o nome da layer
BBFILE_COLLECTIONS += "meta-triolink"

# Isso aqui define o padrão de arquivos dessa layer, eles começam no diretório
# ${LAYERDIR}
BBFILE_PATTERN_meta-triolink = "^${LAYERDIR}/"

#Prioridade de layer, concorrência entre recipes para serem executadas (ver depois)
BBFILE_PRIORITY_meta-triolink = "6"

#Define a dependência da layer, ou seja, em cima de qual estrutura está sendo construída
LAYERDEPENDS_meta-triolink = "core"

#Declara que a layer é compatível com o Scarthgap
LAYERSERIES_COMPAT_meta-triolink = "scarthgap"
