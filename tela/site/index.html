<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrioLink</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='black'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%2319e88a'/%3E%3C/svg%3E">
</head>
<body>
<main class="device">

    <!-- HOME -->
    <section class="screen" id="scr-home">
        <h1 class="title center">SISTEMA DE MONITORAMENTO</h1>
        <div class="grid">
            <button class="card sensor" data-go="bmp">
                <span class="led" id="led-bmp"></span>
                <span class="name">BMP280</span>
            </button>
            <button class="card sensor" data-go="mpu">
                <span class="led" id="led-mpu"></span>
                <span class="name">MPU6050</span>
            </button>
        </div>
        <button class="card power" data-go="off">
            <svg class="ico-power" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M16 4v11M9.5 8.5a10 10 0 1 0 13 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span class="name">DESLIGAR SISTEMA</span>
            <span class="chev">&gt;</span>
        </button>
    </section>

    <!-- BMP280 -->
    <section class="screen" id="scr-bmp" hidden>
        <header class="bar">
            <h1 class="title">BMP280</h1>
            <button class="back" data-go="home">&lt; VOLTAR</button>
        </header>
        <div class="detail">
            <div class="iconbox">
                <svg viewBox="0 0 80 80" aria-hidden="true">
                    <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
                        <path d="M6 28h14M6 40h14M6 52h14M60 28h14M60 40h14M60 52h14M28 6v14M40 6v14M52 6v14M28 60v14M40 60v14M52 60v14"/>
                    </g>
                    <rect x="20" y="20" width="40" height="40" rx="6" fill="#1e1f26" stroke="currentColor" stroke-width="3"/>
                    <circle cx="29" cy="29" r="2.5" fill="currentColor"/>
                </svg>
            </div>
            <div class="values">
                <div class="row"><span>PRESSÃO:</span><b id="bmp-p">--</b></div>
                <div class="row"><span>TEMPERATURA:</span><b id="bmp-t">--</b></div>
                <div class="row"><span>ALTITUDE:</span><b id="bmp-a">--</b></div>
            </div>
        </div>
        <div class="estado">ESTADO: <strong id="bmp-e">--</strong></div>
    </section>

    <!-- MPU6050 -->
    <section class="screen" id="scr-mpu" hidden>
        <header class="bar">
            <h1 class="title">MPU6050</h1>
            <button class="back" data-go="home">&lt; VOLTAR</button>
        </header>
        <div class="detail">
            <div class="iconbox">
                <svg viewBox="0 0 80 80" aria-hidden="true">
                    <g fill="none" stroke="currentColor" stroke-width="3">
                        <ellipse cx="40" cy="40" rx="30" ry="12"/>
                        <ellipse cx="40" cy="40" rx="12" ry="30"/>
                    </g>
                    <circle cx="40" cy="40" r="4" fill="var(--red)"/>
                </svg>
            </div>
            <div class="values">
                <div class="row"><span>DIREÇÃO:</span><b id="mpu-d">--</b></div>
                <div class="row"><span>VELOCIDADE:</span><b id="mpu-v">--</b></div>
            </div>
        </div>
        <div class="estado">ESTADO: <strong id="mpu-e">--</strong></div>
    </section>

    <!-- DESLIGAR -->
    <section class="screen" id="scr-off" hidden>
        <header class="bar"><h1 class="title">DESLIGAR SISTEMA</h1></header>
        <p class="ask">TEM CERTEZA QUE DESEJA<br>DESLIGAR O SISTEMA?</p>
        <div class="yesno">
            <button class="card" id="btn-yes">SIM</button>
            <button class="card" id="btn-no" data-go="home">NÃO</button>
        </div>
    </section>

    <div class="conn" id="conn" role="status"></div>
</main>
<script src="script.js"></script>
</body>
</html>
