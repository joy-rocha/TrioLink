# TrioLink: hora de Brasilia (o fuso vem do DEFAULT_TIMEZONE do triolink.conf).
# Servidores do Observatorio Nacional (ntp.br) e pool brasileiro.
server a.st1.ntp.br iburst
server b.st1.ntp.br iburst
server c.st1.ntp.br iburst
server d.st1.ntp.br iburst
pool pool.ntp.br iburst

driftfile /var/lib/chrony/drift

# A Pi nao tem relogio com bateria: aceita corrigir a hora de uma vez,
# a qualquer momento, quando a rede subir (1.0 = diferenca em segundos; -1 = sem limite de vezes).
makestep 1.0 -1

# mantem o relogio de hardware (se houver) acertado
rtcsync
